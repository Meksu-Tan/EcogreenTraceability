version: "3.8"

services:
  # ──────────────────────────────────────────
  # MySQL Database
  # ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: eods-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eudr_ts
      MYSQL_USER: eods
      MYSQL_PASSWORD: eods_secret
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eods-network

  # ──────────────────────────────────────────
  # Laravel Backend API
  # ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eods-backend
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "EODS API"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:2yTgU/Pj3aVjEjzShx9GD8VQvvJwinRLff+JH5ixLLk=}"
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eudr_ts
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: cookie
      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,127.0.0.1:5173,localhost,127.0.0.1"
      FRONTEND_URL: http://localhost:5173
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eods-network

  # ──────────────────────────────────────────
  # Vue 3 Frontend (Vite Dev Server)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eods-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_APP_ENV: local
    volumes:
      - ./frontend/resources:/app/resources
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - eods-network

  # ──────────────────────────────────────────
  # phpMyAdmin (optional DB GUI)
  # ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: eods-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eods-network

volumes:
  mysql_data:
    driver: local

networks:
  eods-network:
    driver: bridge
