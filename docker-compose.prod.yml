version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: eods_mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: eudr_ts
      MYSQL_ROOT_PASSWORD: prod_rootpassword_change_me
      MYSQL_USER: eo_trace
      MYSQL_PASSWORD: prod_password_change_me
    ports:
      - "3309:3306"
    volumes:
      - eods_db_data_prod:/var/lib/mysql
    networks:
      - eods_network_prod

  # Laravel Master monolithic application (Port 8001)
  master:
    build:
      context: .
      dockerfile: docker/master.dockerfile
    container_name: eods_master_prod
    restart: always
    depends_on:
      - mysql
    ports:
      - "8001:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=eudr_ts
      - DB_USERNAME=eo_trace
      - DB_PASSWORD=prod_password_change_me
    networks:
      - eods_network_prod

  # Laravel Backend API application (Port 8000)
  backend:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    container_name: eods_backend_prod
    restart: always
    depends_on:
      - mysql
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=eudr_ts
      - DB_USERNAME=eo_trace
      - DB_PASSWORD=prod_password_change_me
    networks:
      - eods_network_prod

  # Vue.js Frontend Application (Port 5173 - Production Nginx Mode)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
    container_name: eods_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80" # Map production port 80 inside container to host port 5173 for easy replacement
    networks:
      - eods_network_prod

volumes:
  eods_db_data_prod:
    driver: local

networks:
  eods_network_prod:
    driver: bridge
