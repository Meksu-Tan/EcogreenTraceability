<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F7F4EF; padding: 0; font-family: 'Montserrat', sans-serif; }
nav { background: #fff; border-bottom: 1px solid #D4DDD8; padding: 0 32px; display: flex; align-items: center; height: 64px; gap: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.logo-area { display: flex; align-items: center; gap: 10px; margin-right: 40px; }
.logo-icon { width: 36px; height: 36px; }
.logo-text { display: flex; flex-direction: column; line-height: 1.1; }
.logo-text .name { font-size: 14px; font-weight: 700; color: #1A6B3C; }
.logo-text .sub { font-size: 8px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #97A49C; }
.nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }
.nav-link { padding: 8px 14px; font-size: 13px; font-weight: 500; color: #445048; text-decoration: none; border-radius: 4px; transition: all 200ms; white-space: nowrap; }
.nav-link:hover { color: #1A6B3C; background: #F4FAF5; }
.nav-link.active { color: #1A6B3C; font-weight: 600; }
.nav-cta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn-nav { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: all 200ms; border: none; }
.btn-contact { background: #1A6B3C; color: #fff; }
.btn-contact:hover { background: #155832; }
/* Dark nav variant below */
.dark-nav { background: #0D3B22; border-bottom: none; margin-top: 1px; }
.dark-nav .logo-text .name { color: #fff; }
.dark-nav .logo-text .sub { color: rgba(255,255,255,0.4); }
.dark-nav .nav-link { color: rgba(255,255,255,0.7); }
.dark-nav .nav-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
.dark-nav .nav-link.active { color: #6DB87A; }
.dark-nav .btn-contact { background: #4C9A5A; }
</style>
</head>
<body>
  <!-- Light nav -->
  <nav>
    <div class="logo-area">
      <img src="../assets/logo.svg" class="logo-icon" height="36">
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active">Products</a>
      <a href="#" class="nav-link">Sustainability</a>
      <a href="#" class="nav-link">Certifications</a>
      <a href="#" class="nav-link">About</a>
      <a href="#" class="nav-link">News</a>
    </div>
    <div class="nav-cta">
      <button class="btn-nav btn-contact"><i class="fas fa-envelope" style="margin-right:6px;font-size:11px"></i>Contact Sales</button>
    </div>
  </nav>
  <!-- Dark nav variant -->
  <nav class="dark-nav">
    <div class="logo-area">
      <img src="../assets/logo-white.svg" class="logo-icon" height="36">
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active">Products</a>
      <a href="#" class="nav-link">Sustainability</a>
      <a href="#" class="nav-link">Certifications</a>
      <a href="#" class="nav-link">About</a>
      <a href="#" class="nav-link">News</a>
    </div>
    <div class="nav-cta">
      <button class="btn-nav btn-contact"><i class="fas fa-envelope" style="margin-right:6px;font-size:11px"></i>Contact Sales</button>
    </div>
  </nav>
</body>
</html>
