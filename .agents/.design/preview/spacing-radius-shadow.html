<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F7F4EF; padding: 20px 24px; font-family: var(--font-body); }
.row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.box { width: 56px; height: 40px; background: #fff; border: 1px solid #D4DDD8; }
.lbl { font-family: var(--font-mono); font-size: 10px; color: #5A6860; text-align: center; }
.shadow-row { display: flex; gap: 20px; }
.shadow-box { width: 80px; height: 44px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.shadow-lbl { font-family: var(--font-mono); font-size: 9px; color: #97A49C; margin-top: 6px; text-align: center; }
.section-title { font-family: var(--font-mono); font-size: 10px; color: #97A49C; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="section-title">Border Radius</div>
<div class="row">
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="lbl">2px<br>--radius-sm</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl">4px<br>--radius-md</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="lbl">6px<br>--radius-lg</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="lbl">12px<br>--radius-xl</div></div>
  <div class="item"><div class="box" style="border-radius:100px; width:80px"></div><div class="lbl">100px<br>--radius-pill</div></div>
</div>
<div class="section-title">Elevation / Shadow</div>
<div class="shadow-row">
  <div class="item"><div class="shadow-box" style="box-shadow:0 1px 2px rgba(0,0,0,0.06)"><span style="font-size:9px;color:#97A49C">xs</span></div><div class="shadow-lbl">--shadow-xs</div></div>
  <div class="item"><div class="shadow-box" style="box-shadow:0 2px 8px rgba(0,0,0,0.08)"><span style="font-size:9px;color:#97A49C">sm</span></div><div class="shadow-lbl">--shadow-sm</div></div>
  <div class="item"><div class="shadow-box" style="box-shadow:0 4px 16px rgba(0,0,0,0.10)"><span style="font-size:9px;color:#97A49C">md</span></div><div class="shadow-lbl">--shadow-md</div></div>
  <div class="item"><div class="shadow-box" style="box-shadow:0 8px 24px rgba(0,0,0,0.14)"><span style="font-size:9px;color:#97A49C">lg</span></div><div class="shadow-lbl">--shadow-lg</div></div>
</div>
</body>
</html>
