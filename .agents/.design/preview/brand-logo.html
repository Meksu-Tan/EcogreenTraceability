<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F7F4EF; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.panel { padding: 16px 20px; border-radius: 6px; display: flex; align-items: center; gap: 14px; border: 1px solid rgba(0,0,0,0.07); }
.logo-label { font-family: 'Montserrat', sans-serif; font-size: 9px; color: #97A49C; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
</style>
</head>
<body>
  <!-- Horizontal logo on white -->
  <div>
    <div class="logo-label">Horizontal — on white (preferred)</div>
    <div class="panel" style="background:#fff">
      <img src="../assets/logo-horizontal.jpg" height="56" style="display:block">
    </div>
  </div>
  <!-- Horizontal logo on dark -->
  <div>
    <div class="logo-label">Symbol only — on white</div>
    <div class="panel" style="background:#fff; width:120px">
      <img src="../assets/logo-symbol.jpg" height="56" style="display:block">
    </div>
  </div>
  <!-- Stacked logo -->
  <div>
    <div class="logo-label">Stacked — on white</div>
    <div class="panel" style="background:#fff; display:inline-flex">
      <img src="../assets/logo-stacked.jpg" height="72" style="display:block">
    </div>
  </div>
  <!-- SVG reconstruction on dark bg -->
  <div>
    <div class="logo-label">SVG mark — on dark (for digital use)</div>
    <div class="panel" style="background:#1C3220">
      <img src="../assets/logo-white.svg" height="50" style="display:block">
    </div>
  </div>
</body>
</html>
