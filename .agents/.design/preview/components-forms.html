<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F7F4EF; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; color: #1C2420; margin-bottom: 2px; }
.field-sub { font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: #97A49C; margin-bottom: 4px; }
input, select, textarea { font-family: 'Source Sans 3', sans-serif; font-size: 14px; color: #1C2420; background: #fff; border: 1px solid #D4DDD8; border-radius: 4px; padding: 9px 12px; width: 100%; outline: none; transition: border-color 200ms ease, box-shadow 200ms ease; }
input:focus, select:focus, textarea:focus { border-color: #1A6B3C; box-shadow: 0 0 0 3px rgba(26,107,60,0.12); }
input.error { border-color: #C62828; }
input.success { border-color: #2E7D32; }
.row-fields { display: flex; gap: 12px; }
.row-fields .group { flex: 1; }
.error-msg { font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: #C62828; margin-top: 3px; }
.success-msg { font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: #2E7D32; margin-top: 3px; }
</style>
</head>
<body>
  <div class="row-fields">
    <div class="group">
      <div class="field-label">First Name</div>
      <input type="text" placeholder="John" value="Maria">
    </div>
    <div class="group">
      <div class="field-label">Last Name</div>
      <input type="text" placeholder="Doe" value="Santos">
    </div>
  </div>
  <div class="group">
    <div class="field-label">Company Email</div>
    <div class="field-sub">We respond within 2 business days</div>
    <input type="email" placeholder="you@company.com" class="success" value="m.santos@company.com">
    <div class="success-msg">Valid email address</div>
  </div>
  <div class="group">
    <div class="field-label">Product Interest</div>
    <select>
      <option>Select a product line…</option>
      <option selected>Ecorol® Saturated Fatty Alcohols</option>
      <option>Rofanol® Unsaturated Fatty Alcohols</option>
      <option>Ecoric® Fatty Acids</option>
      <option>Medium Chain Triglycerides (MCT)</option>
      <option>Refined Glycerin</option>
    </select>
  </div>
  <div class="group">
    <div class="field-label">Message</div>
    <textarea rows="3" placeholder="Describe your application and volume requirements…"></textarea>
  </div>
  <div class="group">
    <div class="field-label">Phone</div>
    <input type="tel" placeholder="+65 0000 0000" class="error">
    <div class="error-msg">Please enter a valid phone number</div>
  </div>
</body>
</html>
