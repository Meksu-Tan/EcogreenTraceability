<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: var(--bg-page); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.tokens { display: flex; gap: 8px; flex-wrap: wrap; }
.tok { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #D4DDD8; border-radius: 6px; min-width: 200px; }
.chip { width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.08); }
.tok-info { display: flex; flex-direction: column; }
.tok-name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-brand); }
.tok-val { font-size: 11px; color: var(--fg-secondary); }
</style>
</head>
<body>
<div class="tokens">
  <div class="tok"><div class="chip" style="background:#FFFFFF; border-color:#D4DDD8"></div><div class="tok-info"><span class="tok-name">--bg-page</span><span class="tok-val">#FFFFFF</span></div></div>
  <div class="tok"><div class="chip" style="background:#F7F4EF"></div><div class="tok-info"><span class="tok-name">--bg-subtle</span><span class="tok-val">#F7F4EF</span></div></div>
  <div class="tok"><div class="chip" style="background:#E8F5EC"></div><div class="tok-info"><span class="tok-name">--bg-muted</span><span class="tok-val">#E8F5EC</span></div></div>
  <div class="tok"><div class="chip" style="background:#0D3B22"></div><div class="tok-info"><span class="tok-name">--bg-inverse</span><span class="tok-val">#0D3B22</span></div></div>
  <div class="tok"><div class="chip" style="background:#1A6B3C"></div><div class="tok-info"><span class="tok-name">--bg-brand</span><span class="tok-val">#1A6B3C</span></div></div>
  <div class="tok"><div class="chip" style="background:#1C2420"></div><div class="tok-info"><span class="tok-name">--fg-primary</span><span class="tok-val">#1C2420</span></div></div>
  <div class="tok"><div class="chip" style="background:#5A6860"></div><div class="tok-info"><span class="tok-name">--fg-secondary</span><span class="tok-val">#5A6860</span></div></div>
  <div class="tok"><div class="chip" style="background:#97A49C"></div><div class="tok-info"><span class="tok-name">--fg-muted</span><span class="tok-val">#97A49C</span></div></div>
  <div class="tok"><div class="chip" style="background:#1A6B3C"></div><div class="tok-info"><span class="tok-name">--fg-brand</span><span class="tok-val">#1A6B3C</span></div></div>
  <div class="tok"><div class="chip" style="background:#2E7D32"></div><div class="tok-info"><span class="tok-name">--color-success</span><span class="tok-val">#2E7D32</span></div></div>
  <div class="tok"><div class="chip" style="background:#E65100"></div><div class="tok-info"><span class="tok-name">--color-warning</span><span class="tok-val">#E65100</span></div></div>
  <div class="tok"><div class="chip" style="background:#C62828"></div><div class="tok-info"><span class="tok-name">--color-error</span><span class="tok-val">#C62828</span></div></div>
</div>
</body>
</html>
