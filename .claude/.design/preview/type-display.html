<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); padding: 24px 28px; }
.specimen { border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 12px; }
.specimen:last-child { border-bottom: none; margin-bottom: 0; }
.meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="meta">H1 — Montserrat 700 44px / −0.02em</div>
    <div style="font-family:'Montserrat',sans-serif;font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:#1C2420">Natural Fatty Alcohols</div>
  </div>
  <div class="specimen">
    <div class="meta">H2 — Montserrat 600 36px</div>
    <div style="font-family:'Montserrat',sans-serif;font-size:36px;font-weight:600;letter-spacing:-0.02em;line-height:1.35;color:#1C2420">Global Production Facilities</div>
  </div>
  <div class="specimen">
    <div class="meta">H3 — Montserrat 600 30px</div>
    <div style="font-family:'Montserrat',sans-serif;font-size:30px;font-weight:600;line-height:1.35;color:#1C2420">Ecorol® Fatty Alcohols</div>
  </div>
  <div class="specimen">
    <div class="meta">H4 — Montserrat 600 24px</div>
    <div style="font-family:'Montserrat',sans-serif;font-size:24px;font-weight:600;line-height:1.5;color:#1C2420">Batam, Indonesia</div>
  </div>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
</body>
</html>
