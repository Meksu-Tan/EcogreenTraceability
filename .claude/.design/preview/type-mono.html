<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.block { background: #F4FAF5; border: 1px solid #C2E6C8; border-radius: 6px; padding: 12px 16px; }
.meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-bottom: 6px; }
.code { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #1A6B3C; line-height: 1.7; }
</style>
</head>
<body>
  <div class="block">
    <div class="meta">Chemical grade codes / product specs</div>
    <div class="code">
      Ecorol® C12–C14 &nbsp;→ CAS 112-53-8 / 112-72-1<br>
      Rofanol® C18:1 &nbsp;&nbsp;&nbsp;→ CAS 143-28-2<br>
      MCT C8/C10 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ INCI: Caprylic/Capric Triglyceride
    </div>
  </div>
  <div class="block">
    <div class="meta">Specification table values</div>
    <div class="code">
      Iodine Value &nbsp;&nbsp;&nbsp;&nbsp;≤ 0.5 g I₂/100g<br>
      Hydroxyl Value &nbsp; 218–228 mg KOH/g<br>
      Moisture &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ≤ 0.1%
    </div>
  </div>
</body>
</html>
